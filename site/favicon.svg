<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Yellide">
  <!-- Same construction as the irrational mark: dark rounded square, white geometry,
       one accent dot. Here the geometry is a viewfinder and the dot is the thing you
       were looking for — deliberately off-centre, because it never is where you expect. -->
  <rect width="64" height="64" rx="14" fill="#1a1a18"/>
  <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 25v-4a3 3 0 0 1 3-3h4"/>
    <path d="M46 25v-4a3 3 0 0 0-3-3h-4"/>
    <path d="M18 39v4a3 3 0 0 0 3 3h4"/>
    <path d="M46 39v4a3 3 0 0 1-3 3h-4"/>
  </g>
  <circle cx="37.5" cy="36.5" r="5" fill="#0d9488"/>
</svg>
